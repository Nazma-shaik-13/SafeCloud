<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SafeCloud: Sign up</title><link rel="stylesheet" href="/css/style.css"></head>
<body data-mode="signup"><main class="auth"><div class="card">
<a class="logo" href="/">safecloud.</a><h2>Create your account</h2>
<form id="f"><label for="email">Email</label><input id="email" name="email" type="email" required maxlength="200" autocomplete="email">
<label for="password">Password</label><input id="password" name="password" type="password" required minlength="10" maxlength="200" autocomplete="current-password">
<label for="role">I want to</label><select id="role" name="role"><option value="owner">Upload and share documents</option><option value="viewer">Receive shared documents</option></select><p class="err" id="msg" role="alert"></p><button class="btn" type="submit">Sign up</button></form><p class="mute mt18 small">Have an account? <a href="/login.html"><b>Log in</b></a></p>
</div></main><script src="/js/api.js"></script><script src="/js/auth.js"></script></body></html>
