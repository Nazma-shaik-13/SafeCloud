<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SafeCloud: Log in</title><link rel="stylesheet" href="/css/style.css"></head>
<body data-mode="login"><main class="auth"><div class="card">
<a class="logo" href="/">safecloud.</a><h2>Welcome back</h2>
<form id="f"><label for="email">Email</label><input id="email" name="email" type="email" required maxlength="200" autocomplete="email">
<label for="password">Password</label><input id="password" name="password" type="password" required minlength="10" maxlength="200" autocomplete="current-password">
<p class="err" id="msg" role="alert"></p><button class="btn" type="submit">Log in</button></form><p class="mute mt18 small">New here? <a href="/signup.html"><b>Create an account</b></a></p>
</div></main><script src="/js/api.js"></script><script src="/js/auth.js"></script></body></html>
